name: Build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libssl-dev libvulkan-dev ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Our Vulkan declarations match the official headers
        run: g++ -std=c++20 tests/vk_layout_check.cpp -o /tmp/vk_layout_check && /tmp/vk_layout_check
      - name: Engine tests (cross-checked against git)
        run: TRIBCLI=$PWD/build/tribcli bash tests/engine_test.sh
      - name: Transport tests (smart HTTP against git http-backend)
        run: TRIBCLI=$PWD/build/tribcli bash tests/transport_test.sh
      - name: Rewrite, hooks and SSH tests
        run: TRIBCLI=$PWD/build/tribcli bash tests/rewrite_test.sh
      - name: Git LFS and commit signing tests (against git-lfs and gpg)
        run: |
          sudo apt-get install -y git-lfs gnupg
          TRIBCLI=$PWD/build/tribcli bash tests/lfs_sign_test.sh
      - name: Assistant, MCP server and updater tests
        run: TRIBCLI=$PWD/build/tribcli APP=$PWD/build/Tributary bash tests/ai_mcp_test.sh
      - name: Package
        run: |
          mkdir -p dist/tributary-linux-x86_64
          cp build/Tributary dist/tributary-linux-x86_64/
          cp packaging/linux/tributary.desktop assets/icon/icon-256.png LICENSE README.md dist/tributary-linux-x86_64/
          tar -C dist -czf tributary-linux-x86_64.tar.gz tributary-linux-x86_64
      - uses: actions/upload-artifact@v4
        with: { name: tributary-linux-x86_64, path: tributary-linux-x86_64.tar.gz }

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DTRIBUTARY_BUILD_TOOLS=ON
          cmake --build build --config Release
      - name: Tests (engine, rewrite)
        shell: bash
        run: |
          for t in engine rewrite; do TRIBCLI=$PWD/build/Release/tribcli.exe bash tests/${t}_test.sh; done
          TRIBCLI=$PWD/build/Release/tribcli.exe APP=$PWD/build/Release/Tributary.exe bash tests/ai_mcp_test.sh
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Tributary | Out-Null
          Copy-Item build/Release/Tributary.exe dist/Tributary/
          Copy-Item LICENSE, README.md dist/Tributary/
          Compress-Archive -Path dist/Tributary -DestinationPath tributary-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: tributary-windows-x64, path: tributary-windows-x64.zip }

  macos:
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install ninja
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build
      - name: Tests (engine, transport, rewrite, LFS, signing)
        run: |
          brew install git-lfs gnupg || true
          for t in engine transport rewrite lfs_sign; do TRIBCLI=$PWD/build/tribcli bash tests/${t}_test.sh; done
          TRIBCLI=$PWD/build/tribcli APP=$PWD/build/Tributary.app/Contents/MacOS/Tributary bash tests/ai_mcp_test.sh
      - name: Screenshot (Metal renderer smoke test)
        continue-on-error: true
        run: |
          mkdir -p shot-home
          HOME=$PWD/shot-home perl -e 'alarm 90; exec @ARGV' build/Tributary.app/Contents/MacOS/Tributary --screenshot shot-${{ matrix.arch }}.ppm --screenshot-delay 4
          ls -la shot-*.ppm
      - name: Sign (ad-hoc) and make DMG
        run: |
          codesign --force --deep --sign - build/Tributary.app
          mkdir -p dmg && cp -R build/Tributary.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Tributary -srcfolder dmg -ov -format UDZO tributary-macos-${{ matrix.arch }}.dmg
          # the zip is what in-app updates download
          ditto -c -k --norsrc --noextattr --noacl --keepParent build/Tributary.app tributary-macos-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tributary-macos-${{ matrix.arch }}
          path: |
            tributary-macos-${{ matrix.arch }}.dmg
            tributary-macos-${{ matrix.arch }}.zip
      - name: Publish screenshot to the ci-screenshots branch
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          gzip -9 -c shot-${{ matrix.arch }}.ppm > /tmp/shot.ppm.gz
          git config user.name "github-actions" && git config user.email "actions@github.com"
          for i in 1 2 3; do
            if git fetch -q origin ci-screenshots; then git checkout -q -f -B ci-screenshots FETCH_HEAD
            else git checkout -q --orphan ci-screenshots && git rm -rqf --cached . >/dev/null; fi
            cp /tmp/shot.ppm.gz macos-${{ matrix.arch }}.ppm.gz
            git add macos-${{ matrix.arch }}.ppm.gz
            git commit -qm "screenshot ${{ matrix.arch }} ${GITHUB_SHA::7}" && git push -q origin ci-screenshots && break
            sleep 5
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
